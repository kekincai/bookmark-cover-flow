name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: cd dist && zip -r ../bookmark-cover-flow.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: bookmark-cover-flow.zip
