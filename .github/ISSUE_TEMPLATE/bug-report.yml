name: Bug report
description: Report a reproducible problem in Bookmark Cover Flow.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Bookmark Cover Flow.
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: 'Chrome 140'
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Bookmark Cover Flow version
      placeholder: 'v1.1.0'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public URL or anonymized folder structure when possible.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private bookmark titles, URLs, and personal information from this report.
          required: true
