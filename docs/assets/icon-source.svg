<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8af0"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="left" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#b9b9c0"/>
      <stop offset="1" stop-color="#8e8e95"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b9c0"/>
      <stop offset="1" stop-color="#8e8e95"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0071e3" stop-opacity=".24"/>
      <stop offset=".7" stop-color="#0071e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side-reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e95" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#8e8e95" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <!-- Side covers turned toward the center, outer edges receding. -->
  <path d="M120 338 L292 296 L292 700 L120 658 Z" fill="url(#left)"/>
  <path d="M904 338 L732 296 L732 700 L904 658 Z" fill="url(#right)"/>
  <path d="M120 666 L292 708 L292 800 L120 760 Z" fill="url(#side-reflection)"/>
  <path d="M904 666 L732 708 L732 800 L904 760 Z" fill="url(#side-reflection)"/>
  <!-- Center cover with a bookmark ribbon, and its mirror reflection. -->
  <rect x="300" y="248" width="424" height="424" rx="44" fill="url(#cover)"/>
  <rect x="300" y="684" width="424" height="190" rx="44" fill="url(#reflection)"/>
  <path d="M440 344 h144 a14 14 0 0 1 14 14 v206 l-86 -56 l-86 56 v-206 a14 14 0 0 1 14 -14 z" fill="#ffffff"/>
</svg>
